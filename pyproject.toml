[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sius-ingest"
version = "0.1.0"
description = "Lossless TCP capture tooling for exploring the SIUSData stream"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "eerriikk-pro" },
]
dependencies = []

[project.scripts]
sius-capture = "sius_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
