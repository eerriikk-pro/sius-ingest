[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sius-ingest"
version = "0.2.1"
description = "Capture, parse, segment, persist, and upload SIUSData practice shots"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "eerriikk-pro" },
]
dependencies = []

[project.optional-dependencies]
build = [
  "pyinstaller>=6.21,<7",
]
dev = [
  "ruff>=0.16,<0.17",
]

[project.scripts]
sius-capture = "sius_ingest.cli:main"
sius-ingest = "sius_ingest.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
